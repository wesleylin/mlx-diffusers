[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-diffusers"
version = "0.0.1"
description = "Pure-MLX ports of diffusion models, validated numerically against PyTorch goldens."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mlx",
    "numpy",
    "safetensors",
    "pillow",
    "tqdm",
]

[dependency-groups]
dev = ["pytest"]
reference = [
    "torch",
    "diffusers",
    "transformers",
    "huggingface_hub",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.setuptools]
packages = [
    "mlx_diffusers",
    "mlx_diffusers.models",
    "mlx_diffusers.schedulers",
    "mlx_diffusers.pipelines",
    "mlx_diffusers.training",
    "mlx_diffusers.utils",
]
